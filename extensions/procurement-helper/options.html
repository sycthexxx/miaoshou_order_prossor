<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>采购助手设置</title><style>body{font:14px system-ui;width:360px;padding:22px;color:#263944}h1{font-size:20px}input,button{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin:8px 0}button{background:#009e9c;color:white;cursor:pointer}p{line-height:1.7;color:#64748b}</style><h1>内部采购助手</h1><p>每台电脑首次使用都要连接公司工作台。先打开工作台，再点插件图标，会自动填入当前地址。</p><form id="form"><label>工作台地址<input id="origin" placeholder="http://192.168.1.10:17381" required></label><button>保存并授权此工作台</button></form><p id="result"></p><p>保存授权后在工作台确认“采购助手已连接”，再点击“打开货源”。不读取 Cookie，不自动下单。</p><script type="module" src="options.js"></script></html>
